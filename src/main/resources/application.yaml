#file: noinspection undefined
server:
  port: 9999
  servlet:
    context-path: /api/v1


spring:
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/supermarket_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    # Migrations must be applied in version order; a late, lower-numbered file fails instead of slipping in
    out-of-order: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        connection:
          charSet: utf8mb4
          useUnicode: true
        jdbc:
          # Instants are stored as UTC regardless of the server's time zone
          time_zone: UTC

# SQL parameter values (incl. password hashes) are not logged; enable org.hibernate.orm.jdbc.bind=TRACE locally if needed
logging:
  level:
    org.hibernate.orm.jdbc.bind: INFO

com:
  anonymous:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      valid-duration: 86400
      refreshable-duration: 864000
    origin-client-1: ${ORIGIN_CLIENT_1:http://localhost:4200}
    username-admin: ${ADMIN_USERNAME:admin1234}
    admin-password: ${ADMIN_PASSWORD}
    employee-default-password: ${EMPLOYEE_DEFAULT_PASSWORD}

